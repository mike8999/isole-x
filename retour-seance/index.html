<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retour de séance</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root { --fond:#f4f1ea; --carte:#fff; --encre:#1f2430; --doux:#6b7080; --bord:#e3ded3;
          --plus:#1f9d6b; --plus-f:#e3f5ec; --moins:#d9534f; --moins-f:#fbe7e6; --ryt:#c98a10; --ryt-f:#fbf1dc; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--fond); color:var(--encre); font-family:Nunito,system-ui,sans-serif; }
  main { max-width:460px; margin:0 auto; padding:max(14px,env(safe-area-inset-top)) 14px 18px; min-height:100dvh; display:flex; flex-direction:column; }
  main.large { max-width:760px; }
  header { text-align:center; margin-bottom:10px; position:relative; }
  .cours { display:inline-block; background:var(--encre); color:#fff; border-radius:99px; padding:4px 14px; font-weight:800; font-size:.85rem; }
  h1 { font-size:1.35rem; margin:10px 0 2px; }
  .aide { color:var(--doux); font-size:.9rem; margin:0; }
  .ligne { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .titre-ligne { grid-column:1/-1; font-size:.75rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--doux); margin:6px 0 -4px 4px; }
  .trois { grid-template-columns:repeat(3,1fr); }
  button.choix { font:inherit; font-weight:700; font-size:1rem; border:2px solid var(--bord); background:var(--carte); color:var(--encre);
    border-radius:14px; padding:10px 6px; min-height:52px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; line-height:1.15;
    transition:transform .08s, background .15s, border-color .15s, opacity .15s; }
  button.choix:active { transform:scale(.96); }
  button.choix .coche { width:18px; height:18px; border-radius:5px; border:2px solid currentColor; opacity:.35; flex:none; display:grid; place-items:center; font-size:.75rem; }
  button.choix[aria-pressed=true] .coche { opacity:1; }
  button.choix[aria-pressed=true] .coche::after { content:"✓"; }
  .p[aria-pressed=true] { background:var(--plus-f); border-color:var(--plus); color:#0f6b48; }
  .m[aria-pressed=true] { background:var(--moins-f); border-color:var(--moins); color:#a3302c; }
  .r[aria-pressed=true] { background:var(--ryt-f); border-color:var(--ryt); color:#8a5d06; }
  button.choix:disabled { opacity:.3; cursor:not-allowed; text-decoration:line-through; }
  .bas { margin-top:auto; padding-top:16px; }
  .gros-btn { width:100%; font:inherit; font-weight:800; font-size:1.1rem; border:0; border-radius:16px; padding:16px; background:var(--encre); color:#fff; cursor:pointer; }
  .gros-btn:disabled { opacity:.35; }
  .note { text-align:center; color:var(--doux); font-size:.78rem; margin:8px 0 0; }
  .fin { text-align:center; margin:auto 0; }
  .fin .gros { font-size:3.5rem; }
  .erreur { color:var(--moins); text-align:center; font-weight:700; min-height:1.2em; margin:8px 0 0; font-size:.9rem; }
  .piege { position:absolute; left:-9999px; }
  .outils { position:absolute; top:0; right:0; display:flex; gap:6px; }
  .outils button, .outils a { font:inherit; font-size:.85rem; font-weight:800; border:2px solid var(--bord); background:#fff; color:var(--encre); border-radius:99px; padding:4px 10px; cursor:pointer; text-decoration:none; }
  .prof label, .res label { display:block; font-weight:800; font-size:.85rem; margin:14px 0 4px; }
  .prof input, .res input { width:100%; font:inherit; font-size:1rem; padding:12px; border:2px solid var(--bord); border-radius:12px; background:#fff; }
  .deux { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pastilles { display:flex; flex-wrap:wrap; gap:6px; }
  .pastilles button { font:inherit; font-weight:700; border:2px solid var(--bord); background:#fff; color:var(--encre); border-radius:99px; padding:8px 14px; min-height:42px; cursor:pointer; }
  .pastilles button[aria-pressed=true] { background:var(--encre); border-color:var(--encre); color:#fff; }
  .btns { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btns button, .btns a { flex:1; font:inherit; font-weight:800; border:2px solid var(--encre); border-radius:12px; padding:11px; background:#fff; color:var(--encre); cursor:pointer; text-align:center; text-decoration:none; }
  .btns .princ { background:var(--encre); color:#fff; }
  #qr { background:#fff; border-radius:16px; padding:14px; margin-top:14px; text-align:center; display:none; }
  #qr svg { width:100%; max-width:320px; height:auto; }
  #lien { word-break:break-all; font-size:.8rem; color:var(--doux); margin-top:6px; }
  #ecran { position:fixed; inset:0; background:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; padding:3vh; z-index:9; }
  #ecran.ouvert { display:flex; }
  #ecran .qr { width:min(74vh,90vw); }
  #ecran .qr svg { width:100%; height:auto; }
  #ecran h2 { font-size:4vh; margin:0 0 2vh; text-align:center; }
  #ecran p { font-size:2.4vh; color:var(--doux); margin:2vh 0 0; text-align:center; }
  .bilan { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:12px; }
  .bilan div { background:#fff; border-radius:14px; padding:10px; text-align:center; }
  .bilan b { display:block; font-size:1.4rem; }
  .bilan span { font-size:.78rem; color:var(--doux); }
  .carte { background:#fff; border-radius:16px; padding:14px; margin-top:12px; }
  .carte h3 { margin:0; font-size:1.05rem; }
  .meta { font-size:.82rem; color:var(--doux); margin:2px 0 10px; }
  .tag { display:inline-block; border-radius:99px; padding:1px 8px; font-size:.75rem; font-weight:800; background:var(--fond); margin-left:6px; vertical-align:middle; }
  .paire { display:grid; grid-template-columns:1fr 1fr; gap:2px; align-items:center; font-size:.8rem; margin:5px 0; }
  .demi { position:relative; height:22px; background:var(--fond); border-radius:6px; overflow:hidden; }
  .demi i { position:absolute; top:0; bottom:0; }
  .demi.g i { right:0; background:#8fd8b6; }
  .demi.d i { left:0; background:#f2aaa7; }
  .demi span { position:absolute; inset:0; display:flex; align-items:center; padding:0 6px; font-weight:800; white-space:nowrap; }
  .demi.g span { justify-content:flex-end; }
  .rythme { display:flex; height:22px; border-radius:6px; overflow:hidden; background:var(--fond); font-size:.75rem; font-weight:800; margin:8px 0 2px; }
  .rythme i { display:flex; align-items:center; justify-content:center; color:#fff; font-style:normal; overflow:hidden; white-space:nowrap; }
  .legende { font-size:.72rem; color:var(--doux); display:flex; justify-content:space-between; }
  .seuls { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .seuls span { font-size:.8rem; font-weight:700; border-radius:99px; padding:3px 10px; background:var(--fond); }
  .type-ligne { display:grid; grid-template-columns:110px 1fr 48px; gap:8px; align-items:center; font-size:.85rem; font-weight:700; margin:6px 0; }
  .type-ligne .axe { position:relative; height:20px; background:var(--fond); border-radius:6px; }
  .type-ligne .axe::before { content:""; position:absolute; left:44.4%; top:-3px; bottom:-3px; border-left:2px solid #c9c2b2; }
  .type-ligne .axe i { position:absolute; top:0; bottom:0; border-radius:6px; }
  .courbe svg { width:100%; height:auto; display:block; }
  .vide { text-align:center; color:var(--doux); margin:30px 0; }
  .modal { position:fixed; inset:0; background:rgba(20,22,30,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .dlg { background:#fff; border-radius:18px; padding:18px; width:100%; max-width:420px; }
  .dlg h2 { margin:0 0 6px; }
  .dlg p { margin:0; color:var(--doux); font-size:.9rem; }
  .dlg textarea { width:100%; min-height:110px; margin:10px 0 4px; padding:10px; border-radius:12px; border:2px solid var(--bord); font:inherit; font-size:16px; }
</style>
</head>
<body>
<main id="app"></main>
<div id="ecran"></div>

<script>
// Adresse du serveur Google Apps Script (Déployer > Application Web > URL /exec)
const API = 'https://script.google.com/macros/s/AKfycbzchNkzgSUu5CjhmRSklJut7FchweqA0xxXO__7K4zvDliX7g2NwXeD9HDuMOtr2Bv0Uw/exec';
const URL_IDEES = 'https://isole-x.netlify.app/.netlify/functions/idees';

const PAIRES = [['Utile', 'Inutile'], ['Intéressant', 'Ennuyeux'], ['Clair', 'Confus']];
const RYTHME = ['Trop rapide', 'Rythme adapté', 'Trop lent'];
const SEULS = [['Agréable', 'p'], ['Enrichissant', 'p'], ['Trop difficile', 'm']];
const TYPES = ['Cours', 'TP', 'TD', 'Projet', 'Évaluation'];
// Réponses qui s'excluent
const OPPOSES = [['Utile', 'Inutile'], ['Intéressant', 'Ennuyeux'], ['Clair', 'Confus'], ['Trop rapide', 'Trop lent'],
  ['Trop rapide', 'Rythme adapté'], ['Rythme adapté', 'Trop lent'], ['Inutile', 'Enrichissant'], ['Ennuyeux', 'Agréable']];
const POSITIFS = ['Utile', 'Intéressant', 'Clair', 'Agréable', 'Enrichissant'], NEGATIFS = ['Inutile', 'Ennuyeux', 'Confus', 'Trop difficile'];

const app = document.getElementById('app');
const q = new URLSearchParams(location.search);
const S = { c: (q.get('c') || '').trim(), k: (q.get('k') || '').trim(), t: TYPES.includes(q.get('t')) ? q.get('t') : '',
            n: +q.get('n') || 0, d: /^\d{4}-\d\d-\d\d$/.test(q.get('d') || '') ? q.get('d') : '' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AUJ = new Date().toLocaleDateString('fr-CA', { timeZone: 'Europe/Paris' });
const frDate = d => d ? d.split('-').reverse().join('/') : '';
const stock = { get: k => { try { return localStorage.getItem(k); } catch (_) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} },
                del: k => { try { localStorage.removeItem(k); } catch (_) {} } };
const titreSeance = (c, k, t) => esc(c) + (k ? ' · ' + esc(k) : '') + (t ? ' · ' + esc(t) : '');

/* ---------- Envoi, avec file d'attente si le réseau manque ---------- */
async function envoyer(corps) {
  // text/plain : pas de requête préalable CORS, Apps Script lit le JSON tel quel
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corps) });
  return r.json();
}
const file = () => JSON.parse(stock.get('retour:file') || '[]');
async function viderFile() {
  const f = file();
  if (!f.length || !navigator.onLine) return;
  const reste = [];
  for (const corps of f) {
    try { const d = await envoyer(corps); if (!d.ok && /Trop d'envois|configuré|impossible/.test(d.error || '')) reste.push(corps); }
    catch (_) { reste.push(corps); }
  }
  reste.length ? stock.set('retour:file', JSON.stringify(reste)) : stock.del('retour:file');
  const info = document.getElementById('attente');
  if (info && !reste.length) info.textContent = 'C\'est envoyé, merci !';
}
addEventListener('online', viderFile);
viderFile();

if (S.c) eleve(); else if (q.has('r')) resultats(); else prof();

/* ---------- Élève ---------- */
function eleve() {
  const cle = 'retour:' + [S.c, S.k, S.d || AUJ].join('|');
  if (stock.get(cle)) return merci('deja');
  if (S.d && S.d !== AUJ) return merci('perime');
  const bouton = (nom, cls) => `<button type="button" class="choix ${cls}" data-v="${nom}" aria-pressed="false"><span class="coche"></span>${nom === 'Rythme adapté' ? 'Adapté' : nom}</button>`;
  app.innerHTML = `<header><span class="cours">${titreSeance(S.c, S.k, S.t)}</span>
    <h1>Qu'as-tu pensé de la séance ?</h1><p class="aide">Coche tout ce qui correspond. C'est anonyme.</p></header>
    <div class="ligne"><div class="titre-ligne">Pour moi, cette séance était</div>${PAIRES.map(([a, b]) => bouton(a, 'p') + bouton(b, 'm')).join('')}</div>
    <div class="ligne trois"><div class="titre-ligne">Le rythme</div>${RYTHME.map(n => bouton(n, 'r')).join('')}</div>
    <div class="ligne trois"><div class="titre-ligne">Et aussi</div>${SEULS.map(([n, c]) => bouton(n, c)).join('')}</div>
    <input class="piege" id="site" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="bas"><button class="gros-btn" id="envoyer" disabled>Envoyer</button><p class="erreur" id="err"></p>
    <p class="note">Aucun nom, aucun compte, aucune adresse enregistrés.</p></div>`;

  const btns = [...app.querySelectorAll('button.choix')];
  const choisis = () => btns.filter(b => b.getAttribute('aria-pressed') === 'true').map(b => b.dataset.v);
  const maj = () => {
    const c = choisis();
    btns.forEach(b => b.disabled = OPPOSES.some(p => p.includes(b.dataset.v) && c.includes(p.find(x => x !== b.dataset.v))));
    document.getElementById('envoyer').disabled = !c.length;
  };
  btns.forEach(b => b.addEventListener('click', () => {
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); maj();
  }));
  document.getElementById('envoyer').addEventListener('click', async e => {
    const env = e.currentTarget, err = document.getElementById('err');
    const corps = { cours: S.c, classe: S.k, type: S.t, effectif: S.n, date: S.d || AUJ, choix: choisis(), site: document.getElementById('site').value };
    err.textContent = ''; env.disabled = true; env.textContent = 'Envoi…';
    let d;
    try { d = await envoyer(corps); }
    catch (_) { // pas de réseau : la réponse attend sur le téléphone
      stock.set('retour:file', JSON.stringify(file().concat([corps])));
      stock.set(cle, '1');
      return merci('attente');
    }
    if (d.ok) { stock.set(cle, '1'); return merci('ok'); }
    if (d.perime) return merci('perime');
    err.textContent = (d.error || 'Erreur') + '. Réessaie.';
    env.disabled = false; env.textContent = 'Envoyer';
  });
}

function merci(cas) {
  const M = { ok: ['🙏', 'Merci, c\'est envoyé !', ''],
              deja: ['👌', 'Tu as déjà répondu pour cette séance', ''],
              perime: ['⏰', 'Ce QR code n\'est plus valable', 'Il ne sert que le jour de la séance (' + frDate(S.d) + ').'],
              attente: ['📶', 'Pas de réseau : ta réponse est gardée', 'Elle partira dès que la connexion revient. Laisse cette page ouverte ou rouvre-la plus tard.'] }[cas];
  app.innerHTML = `<div class="fin"><div class="gros">${M[0]}</div><h1 id="attente">${M[1]}</h1>
    <p class="aide">${M[2] ? M[2] + '<br>' : ''}${titreSeance(S.c, S.k, S.t)}</p></div>`;
}

/* ---------- Professeur : lien et QR code d'une séance ---------- */
function prof() {
  const derniers = JSON.parse(stock.get('retour:derniers') || '[]'), dernier = derniers[0] || {};
  let type = dernier.t || '';
  app.innerHTML = `<div class="prof"><header><div class="outils"><button id="ideeOpen" title="Boîte à idées">💡</button></div>
    <span class="cours">Professeur</span><h1>QR code d'une séance</h1>
    <p class="aide">Les élèves le scannent en fin d'heure. Il ne marche que le jour choisi.</p></header>
    <label for="fc">Cours ou séance</label><input id="fc" list="lc" placeholder="ex. Diodes et DEL" maxlength="80">
    <datalist id="lc">${derniers.map(d => `<option value="${esc(d.c)}">`).join('')}</datalist>
    <label>Type de séance</label><div class="pastilles" id="types">${TYPES.map(t => `<button type="button" data-t="${t}" aria-pressed="${t === type}">${t}</button>`).join('')}</div>
    <div class="deux"><div><label for="fk">Classe</label><input id="fk" list="lk" placeholder="ex. TSIN" maxlength="30" value="${esc(dernier.k || '')}">
      <datalist id="lk">${['TSIN', 'TITEC', 'TEE', 'TAC', 'TSTI2D', '1STI2D', '1SI', 'TSI'].map(c => `<option value="${c}">`).join('')}</datalist></div>
      <div><label for="fn">Effectif</label><input id="fn" type="number" inputmode="numeric" min="1" max="60" placeholder="ex. 24" value="${dernier.n || ''}"></div></div>
    <label for="fd">Date de la séance</label><input id="fd" type="date" value="${AUJ}">
    <div class="btns"><button class="princ" id="gen">Créer le QR code</button><a href="?r">📊 Résultats</a></div>
    <div id="qr"><div id="qrimg"></div><div id="lien"></div>
      <div class="btns"><button id="plein">Plein écran</button><button id="copie">Copier le lien</button><button id="test">Tester</button></div></div></div>`;
  const $ = id => document.getElementById(id);
  $('types').onclick = e => {
    const b = e.target.closest('[data-t]'); if (!b) return;
    type = type === b.dataset.t ? '' : b.dataset.t;
    $('types').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.t === type));
  };
  let url = '';
  $('gen').onclick = () => {
    const c = $('fc').value.trim(), k = $('fk').value.trim(), n = Math.round(+$('fn').value) || 0, d = $('fd').value || AUJ;
    if (!c) { $('fc').focus(); return; }
    const p = new URLSearchParams({ c }); if (k) p.set('k', k); if (type) p.set('t', type); if (n > 0) p.set('n', n); p.set('d', d);
    url = location.origin + location.pathname + '?' + p.toString();
    const svg = qrSvg(url);
    $('qrimg').innerHTML = svg; $('lien').textContent = url; $('qr').style.display = 'block';
    stock.set('retour:derniers', JSON.stringify([{ c, k, t: type, n }].concat(derniers.filter(x => x.c !== c)).slice(0, 15)));
    $('ecran').innerHTML = `<h2>${titreSeance(c, k, type)}</h2><div class="qr">${svg}</div>
      <p>Scanne pour donner ton avis (anonyme) · valable le ${frDate(d)} · touche pour fermer</p>`;
  };
  $('plein').onclick = () => {
    const ec = $('ecran'); ec.classList.add('ouvert');
    if (ec.requestFullscreen) ec.requestFullscreen().catch(() => {});
    ec.onclick = () => { ec.classList.remove('ouvert'); if (document.fullscreenElement) document.exitFullscreen(); };
  };
  $('copie').onclick = e => navigator.clipboard.writeText(url).then(() => { e.target.textContent = 'Copié ✓'; setTimeout(() => e.target.textContent = 'Copier le lien', 1500); });
  $('test').onclick = () => window.open(url, '_blank');
}

function qrSvg(texte) {
  const qr = qrcode(0, 'M'); qr.addData(texte); qr.make();
  return qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
}

/* ---------- Résultats ---------- */
function resultats() {
  app.classList.add('large');
  let lignes = null, fClasse = '', fType = '';
  const code = stock.get('retour:code') || '';
  app.innerHTML = `<div class="res"><header><div class="outils"><a href="./" title="Créer un QR code">＋ QR</a><button id="ideeOpen" title="Boîte à idées">💡</button></div>
    <span class="cours">Professeur</span><h1>Résultats des séances</h1></header>
    <form id="fcode" class="deux" style="align-items:end"><div><label for="code">Code professeur</label><input id="code" type="password" autocomplete="current-password" value="${esc(code)}"></div>
    <div class="btns" style="margin:0"><button class="princ">Afficher</button></div></form><p class="erreur" id="err"></p><div id="zone"></div></div>`;
  const $ = id => document.getElementById(id);
  $('fcode').onsubmit = async e => {
    e.preventDefault();
    const c = $('code').value.trim(); if (!c) return;
    $('err').textContent = ''; $('zone').innerHTML = '<p class="vide">Chargement…</p>';
    try {
      const r = await fetch(API + '?action=resultats&code=' + encodeURIComponent(c));
      const d = await r.json();
      if (!d.ok) throw new Error(d.error);
      stock.set('retour:code', c); lignes = d.lignes; dessiner();
    } catch (x) { $('zone').innerHTML = ''; $('err').textContent = x.message === 'Failed to fetch' ? 'Pas de connexion.' : x.message; }
  };
  if (code) $('fcode').requestSubmit();
  window.__voir = l => { lignes = l; dessiner(); }; // pour les tests

  function dessiner() {
    const classes = [...new Set(lignes.map(l => l.k).filter(Boolean))].sort();
    const types = TYPES.filter(t => lignes.some(l => l.t === t));
    const L = lignes.filter(l => (!fClasse || l.k === fClasse) && (!fType || l.t === fType));
    // Regroupement par séance : date + cours + classe
    const G = {};
    L.forEach(l => {
      const id = [l.d, l.c, l.k].join('|');
      const g = G[id] = G[id] || { d: l.d, c: l.c, k: l.k, t: '', n: 0, eff: 0, x: {} };
      g.n++; if (l.n) g.eff = Math.max(g.eff, l.n); if (l.t) g.t = l.t; l.x.forEach(c => g.x[c] = (g.x[c] || 0) + 1);
    });
    const seances = Object.values(G).sort((a, b) => (b.d || '').localeCompare(a.d || ''));
    const score = g => (POSITIFS.reduce((s, c) => s + (g.x[c] || 0), 0) - NEGATIFS.reduce((s, c) => s + (g.x[c] || 0), 0)) / g.n;
    const pc = (g, c) => Math.round(100 * (g.x[c] || 0) / g.n);
    const avecEff = seances.filter(g => g.eff);
    const part = avecEff.length ? Math.round(100 * avecEff.reduce((s, g) => s + Math.min(g.n, g.eff), 0) / avecEff.reduce((s, g) => s + g.eff, 0)) : null;
    const moy = seances.length ? seances.reduce((s, g) => s + score(g), 0) / seances.length : 0;
    const parType = TYPES.map(t => { const s = seances.filter(g => g.t === t); return s.length ? [t, s.reduce((a, g) => a + score(g), 0) / s.length, s.length] : null; }).filter(Boolean);
    const pastilles = (liste, actif, attr) => `<button type="button" ${attr}="" aria-pressed="${!actif}">Toutes</button>` +
      liste.map(v => `<button type="button" ${attr}="${esc(v)}" aria-pressed="${actif === v}">${esc(v)}</button>`).join('');

    let h = `${classes.length > 1 ? `<label>Classe</label><div class="pastilles" id="fk">${pastilles(classes, fClasse, 'data-k')}</div>` : ''}
      ${types.length > 1 ? `<label>Type de séance</label><div class="pastilles" id="ft">${pastilles(types, fType, 'data-t')}</div>` : ''}
      <div class="bilan"><div><b>${seances.length}</b><span>séances</span></div><div><b>${L.length}</b><span>réponses</span></div>
      <div><b>${part === null ? '–' : part + ' %'}</b><span>participation</span></div><div><b>${moy.toFixed(1)}</b><span>score moyen (de −4 à +5)</span></div></div>`;
    if (parType.length > 1) h += `<div class="carte"><h3>Par type de séance</h3><p class="meta">Score moyen par élève : réponses positives − réponses négatives</p>
      ${parType.map(([t, s, n]) => ligneType(t + ' (' + n + ')', s)).join('')}</div>`;
    if (seances.length > 1) h += courbe(seances.slice().reverse(), score);
    if (!seances.length) h += '<p class="vide">Aucune réponse pour l\'instant.</p>';
    seances.forEach(g => {
      const r = RYTHME.map(c => pc(g, c));
      h += `<div class="carte"><h3>${esc(g.c)}${g.t ? `<span class="tag">${esc(g.t)}</span>` : ''}</h3>
        <p class="meta">${frDate(g.d)}${g.k ? ' · ' + esc(g.k) : ''} · ${g.n} réponse${g.n > 1 ? 's' : ''}${g.eff ? ' sur ' + g.eff + ' (' + Math.round(100 * Math.min(g.n, g.eff) / g.eff) + ' %)' : ''} · score ${score(g).toFixed(1)}</p>
        ${PAIRES.map(([a, b]) => `<div class="paire"><div class="demi g"><i style="width:${pc(g, a)}%"></i><span>${a} ${pc(g, a)} %</span></div>
          <div class="demi d"><i style="width:${pc(g, b)}%"></i><span>${b} ${pc(g, b)} %</span></div></div>`).join('')}
        <div class="rythme">${[['var(--moins)', r[0]], ['var(--plus)', r[1]], ['var(--ryt)', r[2]]].map(([c, v]) => v ? `<i style="width:${v}%;background:${c}">${v} %</i>` : '').join('')}</div>
        <div class="legende"><span>Trop rapide</span><span>Rythme adapté</span><span>Trop lent</span></div>
        <div class="seuls">${SEULS.map(([c]) => `<span>${c} ${pc(g, c)} %</span>`).join('')}</div></div>`;
    });
    $('zone').innerHTML = h;
    if ($('fk')) $('fk').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { fClasse = b.dataset.k; dessiner(); } };
    if ($('ft')) $('ft').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { fType = b.dataset.t; dessiner(); } };
  }
  // Barre de score sur un axe de −4 à +5 (zéro marqué)
  function ligneType(nom, s) {
    const z = 4 / 9 * 100, x = (s + 4) / 9 * 100;
    const g = Math.min(z, x), w = Math.abs(x - z);
    return `<div class="type-ligne"><span>${esc(nom)}</span><div class="axe"><i style="left:${g}%;width:${w}%;background:${s >= 0 ? 'var(--plus)' : 'var(--moins)'}"></i></div><b>${s >= 0 ? '+' : ''}${s.toFixed(1)}</b></div>`;
  }
  function courbe(liste, score) {
    const W = 700, H = 170, m = 30, y = s => 12 + (5 - s) / 9 * (H - 24);
    const pts = liste.map((g, i) => [m + i * (W - 2 * m) / Math.max(1, liste.length - 1), y(score(g))]);
    return `<div class="carte courbe"><h3>Évolution du score</h3><p class="meta">Un point par séance, de la plus ancienne à la plus récente</p>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du score par séance">
      <line x1="${m}" x2="${W - m}" y1="${y(0)}" y2="${y(0)}" stroke="#d8d2c4" stroke-dasharray="4 4"/>
      <text x="4" y="${y(0) + 4}" font-size="18" fill="#6b7080">0</text><text x="4" y="${y(5) + 4}" font-size="18" fill="#6b7080">+5</text><text x="4" y="${y(-4) + 4}" font-size="18" fill="#6b7080">−4</text>
      <polyline fill="none" stroke="#1f2430" stroke-width="2.5" points="${pts.map(p => p.join(',')).join(' ')}"/>
      ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${score(liste[i]) >= 0 ? '#1f9d6b' : '#d9534f'}"><title>${esc(liste[i].c)} · ${frDate(liste[i].d)} : ${score(liste[i]).toFixed(1)}</title></circle>`).join('')}
      </svg></div>`;
  }
}

/* ---------- Boîte à idées (base Notion, anonyme) ---------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#ideeOpen')) return;
  const box = document.createElement('div');
  box.className = 'modal';
  box.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h2>💡 Boîte à idées</h2><p>Une idée pour améliorer l'appli, un bug ? C'est anonyme.</p>
    <textarea id="ideeTxt" maxlength="600" placeholder="Mon idée : …"></textarea><input class="piege" id="ideeSite" tabindex="-1" aria-hidden="true">
    <p class="erreur" id="ideeMsg"></p><div class="btns"><button id="ideeClose">Fermer</button><button class="princ" id="ideeSend">Envoyer</button></div></div>`;
  document.body.appendChild(box);
  const t = box.querySelector('#ideeTxt'), m = box.querySelector('#ideeMsg');
  box.onclick = ev => { if (ev.target === box || ev.target.id === 'ideeClose') box.remove(); };
  box.querySelector('#ideeSend').onclick = async ev => {
    const texte = t.value.trim();
    if (texte.length < 5) { m.textContent = 'Écris au moins quelques mots.'; return; }
    ev.target.disabled = true; m.style.color = ''; m.textContent = 'Envoi…';
    try {
      const r = await fetch(URL_IDEES, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texte, type: 'Autre', jeu: 'Retour de séance', ecran: 'Retour de séance · ' + (q.has('r') ? 'résultats' : 'professeur'), site: box.querySelector('#ideeSite').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.error || 'Envoi impossible pour le moment');
      t.value = ''; m.style.color = 'var(--plus)'; m.textContent = 'Merci, ton idée est bien arrivée.';
    } catch (x) { m.textContent = x.message === 'Failed to fetch' ? 'Pas de connexion : réessaie plus tard.' : x.message; }
    ev.target.disabled = false;
  };
  setTimeout(() => t.focus(), 0);
});
</script>
