<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Répartition des postes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: ludique et clair, dans la famille d'Isole x ! (plateau vert).
   IDEA: un plateau de jeu en feutre : chaque bénévole est un jeton crème qu'on pose sur les cartes des tâches.
   PICTURE: le banc des jetons en haut, puis les tâches en tuiles où les jetons se posent.
   COLOUR and TYPE: feutre vert, jetons crème, or pour la sélection et les postes complets ; police manuscrite + system-ui.
   LAYOUT: titre et badges, banc collant, panneaux par catégorie avec grille de tuiles. */
:root{--felt1:#5b8a3f;--felt2:#2f5224;--felt3:#24411b;--card:#f4efdc;--ink:#2b2a22;--gold1:#ffe27a;--gold2:#e2a826;--line:rgba(255,255,240,.35);--red:#ff9a8a;
--hand:"Segoe Print","Comic Neue","Comic Sans MS","Chalkboard SE",cursive}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--felt3)}
body{margin:0;min-height:100vh;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fffbea;overflow-x:hidden;overflow-x:clip;
background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.10),transparent 60%),repeating-radial-gradient(circle at 20% 30%,rgba(0,0,0,.035) 0 2px,transparent 2px 5px),linear-gradient(160deg,var(--felt1),var(--felt2) 70%,var(--felt3));background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
.wrap{width:min(1120px,100%);margin:auto;padding:18px 16px 60px}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:block;width:64px;height:61px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.35);flex:none}
.ttl{font:700 clamp(28px,5vw,46px)/1.1 var(--hand);color:#fffbea;background:none;border:0;border-bottom:2px dashed transparent;text-shadow:0 3px 0 rgba(0,0,0,.25);flex:1;padding:0}
.ttl:hover,.ttl:focus{border-bottom-color:var(--line);outline:none}
.sub{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:10px 0 14px}
.date{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;color-scheme:dark;min-height:40px}
.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.22);border:0;border-radius:8px;padding:4px 10px;font:600 15px system-ui,sans-serif;white-space:nowrap}
.badge b{color:var(--gold1);font-size:19px}.badge.warn{background:rgba(120,30,15,.55)}.badge.warn b{color:#ffd2c7}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:2px solid var(--line);background:rgba(255,255,255,.06);padding:8px 16px;border-radius:999px;text-decoration:none;color:inherit;min-height:44px;display:inline-flex;align-items:center;font-weight:600}
.chip[aria-current]{background:var(--card);color:var(--ink);border-color:var(--card)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-right:auto}
.bigbtn{background:linear-gradient(var(--gold1),var(--gold2));color:#3a2a00;border:0;border-radius:12px;padding:10px 18px;font-weight:700;box-shadow:0 3px 0 #9b6f10;min-height:44px;cursor:pointer}
.bigbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #9b6f10}
.ghostbtn{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:12px;padding:9px 16px;min-height:44px;cursor:pointer}
.ghostbtn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--gold1);outline-offset:2px}
.status{font-size:14px;min-height:20px;margin:-4px 0 10px}.status.warn{color:var(--red);opacity:1}
.bench{position:sticky;top:0;z-index:10;background:rgba(36,65,27,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin-bottom:14px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bench.hot{border-color:var(--gold1);box-shadow:0 0 0 3px rgba(255,226,122,.4)}
.bench h2,.chap h2{font:700 18px var(--hand);margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.bench h2 small,.chap h2 small{font:400 13px system-ui;opacity:.8}
.jetons{display:flex;flex-wrap:wrap;gap:8px}
.jeton{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 12px;border-radius:9px;background:var(--card);color:var(--ink);font:600 16px system-ui,sans-serif;box-shadow:0 3px 0 #b8ad8a,0 4px 8px rgba(0,0,0,.3);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;white-space:nowrap;border:2px solid transparent}
.jeton small{font:600 12px system-ui;background:rgba(0,0,0,.08);border-radius:6px;padding:1px 5px}
.jeton.sel{background:linear-gradient(145deg,var(--gold1),var(--gold2));color:#4a2c00;border-color:#fff3b8;box-shadow:0 3px 0 #9b6f10,0 0 14px rgba(255,214,90,.9)}
.jeton.lift{opacity:.35}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.tip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 12px;font-size:14px;margin-top:10px}
.tip button{margin-left:auto}
.chap{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.lnk{background:none;border:0;color:var(--gold1);font:600 14px system-ui;cursor:pointer;padding:8px 4px;min-height:40px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.task{position:relative;border:2px solid var(--line);border-radius:12px;background:rgba(255,255,255,.08);padding:7px 9px 8px;cursor:pointer;transition:background .15s,border-color .15s,transform .12s}
.task:hover{background:rgba(255,255,255,.13)}
.task.ok{border-color:var(--gold2);background:rgba(255,226,122,.12)}
.task.mine{box-shadow:0 0 0 3px var(--gold1)}
body.dragging .task{border-style:dashed}
.task.hot{border-style:solid!important;border-color:var(--gold1);background:rgba(255,226,122,.3);box-shadow:inset 0 0 0 2px var(--gold1)}
.jeton{-webkit-touch-callout:none}
html.dragging,html.dragging body{overscroll-behavior:none;touch-action:none}
.jeton.grab{outline:3px solid var(--gold1);outline-offset:1px}
.task h3{font:600 15px/1.25 system-ui,sans-serif;margin:0 28px 2px 0}
.meta{font-size:13px;color:#fffbea;display:flex;gap:4px 8px;flex-wrap:wrap}
.count{font-weight:700;color:var(--gold1)}.task:not(.ok) .count.short{color:#fff;background:#a3261a;border-radius:6px;padding:0 6px}
.note{font-size:13px;opacity:.95;margin-top:1px}
.slots{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:30px}
.slots .jeton{font-size:14px;min-height:28px;padding:1px 8px;border-radius:7px;box-shadow:0 2px 0 #b8ad8a,0 2px 5px rgba(0,0,0,.3)}
.slot{min-width:52px;min-height:28px;border-radius:7px;border:2px dashed rgba(255,255,240,.7);border-radius:9px;display:grid;place-items:center;font-size:13px;color:#fffbea}
.edit{position:absolute;top:4px;right:4px;width:30px;height:30px;font-size:14px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.2);cursor:pointer;display:grid;place-items:center}
.edit:hover{background:rgba(255,255,255,.18)}
.empty{opacity:.7;font-style:italic;margin:4px 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.people ul{list-style:none;margin:0;padding:0}.people li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.people li em{font-style:normal;opacity:.8;font-size:14px;white-space:nowrap;flex:none}
.lst{list-style:none;padding:0;margin:0}.lst li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.txt{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:rgba(0,0,0,.2);font-size:16px;width:100%;flex:1}
.addrow{display:flex;gap:8px;margin-top:10px}
.x{background:none;border:0;width:44px;height:44px;border-radius:10px;cursor:pointer;opacity:.8;flex:none}.x:hover{background:rgba(255,255,255,.12);opacity:1}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,20,8,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:200}
.dlg{background:var(--card);color:var(--ink);border-radius:18px;padding:22px;width:min(520px,100%);max-height:92vh;overflow:auto;box-shadow:0 6px 0 #b8ad8a,0 20px 50px rgba(0,0,0,.5)}
.dlg h2{font:700 26px var(--hand);margin:0 0 12px}
.dlg label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.dlg .txt{background:#fffdf4;border-color:#cfc6a6;color:var(--ink)}
.dlg .ghostbtn{background:#e8e0c4;border-color:#cfc6a6}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chk{display:flex;gap:8px;align-items:center;margin-top:8px}.chk input{width:20px;height:20px;accent-color:var(--gold2)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:flex-end}.acts .del{margin-right:auto;color:#a3261a}

.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.block{display:flex;flex-direction:column;gap:5px;text-decoration:none;color:inherit;background:rgba(0,0,0,.18);border:2px solid var(--line);border-radius:14px;padding:10px 12px;transition:background .15s,transform .12s,border-color .15s;cursor:pointer;font:inherit;text-align:left}
.block:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.block.ok{border-color:var(--gold2);background:rgba(255,226,122,.1)}
.block h2{font:700 19px/1.15 var(--hand);margin:0}.bh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 8px}.bh h2{overflow-wrap:anywhere}.pr{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;white-space:nowrap}.pr .prog{flex:1}
.block .meta{font-size:13px;opacity:.8}
.prog{height:6px;border-radius:99px;background:rgba(0,0,0,.25);overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold1),var(--gold2));border-radius:99px}
.block .go{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{border-radius:99px;padding:1px 8px;font-size:12px;white-space:nowrap;flex:none;font-weight:700;background:rgba(0,0,0,.25)}.pill.short{color:#fff;background:#a3261a}.pill.ok{color:var(--gold1)}
.block.new{border-style:dashed;align-items:center;justify-content:center;opacity:.85;min-height:76px}.block.new h2{font-size:17px}
.cathead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:6px}
.cathead h1{font:700 clamp(24px,4vw,34px)/1.1 var(--hand);margin:0 auto 0 4px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.board{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:start}
.dock{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;margin:0;order:2}
.dock .jetons{flex-direction:column;align-items:stretch;gap:6px}.dock .jeton{min-height:34px;padding:2px 10px}.dock .jeton{justify-content:space-between}
.dock .hint{font-size:13px;opacity:.9;margin:0 0 8px}.mhint{display:none}
@media(max-width:899px){.board{grid-template-columns:minmax(0,1fr) 90px;gap:8px}.mhint{display:block;font-size:14px;margin:-4px 0 10px}
 .tasks{grid-template-columns:minmax(0,1fr)}
 .dock{top:8px;max-height:calc(100vh - 80px);padding:6px;border-radius:12px;backdrop-filter:none;-webkit-backdrop-filter:none}
 .dock h2{font-size:14px;margin:0 0 6px;justify-content:center}.dock .hint{display:none}
 .dock .jetons{gap:5px}.dock .jeton{font-size:14px;min-height:42px;padding:2px 4px;justify-content:center;overflow:hidden;text-overflow:ellipsis}.dock .jeton small{display:none}
 .dock,.board>*{min-width:0} .dock .jetons{display:block}.dock .jeton{display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;min-width:0;margin-bottom:5px;line-height:1.15;padding:4px 3px;text-align:center;font-size:13px;white-space:normal;overflow-wrap:anywhere;word-break:break-word}
 .dock .tip{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:60;background:rgba(20,35,15,.96);border:1px solid var(--line);flex-wrap:nowrap;margin:0;box-shadow:0 8px 24px rgba(0,0,0,.4)}
 .dock .tip .ghostbtn{min-height:38px;padding:6px 12px;flex:none}
 body.hasdock.selecting .wrap{padding-bottom:80px}
 .cathead h1{flex-basis:100%;order:-1;margin:0}}
@media(max-width:600px){.two{grid-template-columns:1fr}.tabs{width:100%}.tabs .chip{flex:1;justify-content:center;padding:8px 6px;font-size:14px;white-space:nowrap}.jeton{font-size:15px}}
@media(prefers-reduced-motion:no-preference){.jeton.sel{animation:glow 2.4s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 3px 0 #9b6f10,0 0 22px rgba(255,214,90,1)}}}

.title .tcol{display:flex;flex-direction:column;gap:6px;flex:1}
.title .date{align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stat{background:rgba(0,0,0,.22);border-radius:10px;padding:6px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;font:600 13px/1.2 system-ui,sans-serif}
.stat b{color:var(--gold1);font-size:20px}
.stat.warn{background:rgba(120,30,15,.55)}.stat.warn b{color:#ffd2c7}
nav.tabs{margin:0 0 8px}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tools button{width:100%;min-height:44px;padding:8px 6px;font:600 15px system-ui,sans-serif;color:inherit}
.tools .bigbtn{color:#3a2a00;font-weight:700}
@media(max-width:699px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}.tools .bigbtn{grid-column:1/-1}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.blocks{grid-template-columns:repeat(auto-fill,minmax(min(calc(50% - 5px),250px),1fr))}
@media(max-width:599px){.block{padding:8px 9px;min-height:118px}.block h2{font-size:16px}.block .bh{flex-direction:column;align-items:flex-start;gap:4px}.block .pill{font-size:12px}.block .meta{font-size:12px}.block.new{min-height:118px}}
.jeton.tous{background:linear-gradient(var(--gold1),var(--gold2));color:#3a2a00;box-shadow:0 3px 0 #9b6f10,0 4px 8px rgba(0,0,0,.3)}
.dlg span.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.wheel{position:relative;height:120px;border:1px solid #cfc6a6;border-radius:12px;background:#fffdf4;overflow:hidden}
.wheel::before{content:"";position:absolute;left:6px;right:6px;top:40px;height:40px;border-radius:8px;background:rgba(226,168,38,.25);border:2px solid var(--gold2);pointer-events:none}
.wheel::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;background:linear-gradient(#fffdf4,rgba(255,253,244,0) 35%,rgba(255,253,244,0) 65%,#fffdf4)}
.wl{height:120px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:40px 0;scrollbar-width:none;overscroll-behavior:contain}
.wl::-webkit-scrollbar{display:none}
.wi{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font:600 17px system-ui,sans-serif;color:#6d6650;cursor:pointer;user-select:none}
.wi.on{color:var(--ink);font-weight:800;font-size:19px}
.wheel.off{opacity:.35;pointer-events:none}
.two.wheels{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.dlg textarea.txt{min-height:180px;font:inherit;font-size:16px;resize:vertical}
.chap h2 #reset{font:600 14px system-ui,sans-serif;color:inherit}
.dlg.wide{width:min(1000px,100%)}
.apbox{max-height:60vh;overflow:auto;background:#fff;border-radius:10px;padding:10px 14px;border:1px solid #cfc6a6}
.apmsg{min-height:1.2em;font-weight:600;margin:8px 0 0}
.ptab{font:14px/1.35 system-ui,sans-serif;color:#222}
.ptab h1{font:700 22px system-ui,sans-serif;margin:0 0 2px}.ptab .pdate{margin:0 0 8px;opacity:.75}
.ptab h2{font:700 16px system-ui,sans-serif;margin:14px 0 4px}
.ptab table{width:100%;border-collapse:collapse;table-layout:fixed}
.ptab th:nth-child(1){width:34%}.ptab th:nth-child(2){width:12%}.ptab th:nth-child(3){width:8%}.ptab th:nth-child(4){width:8%}
.ptab th,.ptab td{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}
.ptab th{background:#eee}.ptab td small{display:block;opacity:.7}.ptab em{color:#a3261a;font-style:normal;font-weight:600}
#printzone{display:none}
.drow{display:flex;align-items:center;flex-wrap:wrap}.drow>*{margin-right:8px}
.lockbtn{min-height:34px;padding:4px 12px;border-radius:999px;border:2px solid var(--line);background:rgba(0,0,0,.2);color:inherit;font:700 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}.lockbtn:hover{background:rgba(255,255,255,.15)}.lockbtn.on{background:#7a2a1c;border-color:#e7a08f}
.lockbadge{background:#7a2a1c!important}
body.locked .edit,body.locked .clr,body.locked .bdel,body.locked [data-addtask],body.locked #undo,body.locked #newcat,body.locked .delcat,body.locked .pqdel,body.locked #addm,body.locked #reset,body.locked .slot,body.locked .mhint,body.locked .dock .hint,body.locked .task:not(.fait) .done{display:none!important}
body.locked .done{pointer-events:none}body.locked .task,body.locked .jeton{cursor:default}body.locked .ttl:disabled,body.locked .date:disabled,body.locked .pq:disabled{opacity:1;color:inherit;-webkit-text-fill-color:currentColor}
body.locked .tools{grid-template-columns:repeat(3,minmax(0,1fr))}
.block.new{grid-column:1/-1;min-height:56px!important}
@media print{body>*:not(#printzone){display:none!important}#printzone{display:block!important}html,body{background:#fff!important;color:#000}.ptab h2{break-after:avoid}.ptab tr{break-inside:avoid}}

.jeton.bureau{border:2px dashed var(--gold2);background:#efe3b8}
.clr{margin-left:auto;align-self:center;min-height:28px;padding:2px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:inherit;font:600 13px system-ui,sans-serif;cursor:pointer}
.clr:hover{background:rgba(120,30,15,.55)}
.plaques{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.plaque{display:inline-flex;align-items:center;gap:2px;background:var(--card);color:var(--ink);border-radius:12px;padding:3px 4px 3px 10px;box-shadow:0 3px 0 rgba(0,0,0,.25);border:2px solid transparent}
.plaque:focus-within{border-color:var(--gold2)}.plaque.bureau{border:2px dashed var(--gold2);background:#efe3b8}
.plaque .pq{border:0;background:transparent;color:inherit;font:700 16px system-ui,sans-serif;padding:6px 2px;min-width:3ch;max-width:60vw;flex:none;outline:none;box-shadow:none}
.pqdel{border:0;background:transparent;cursor:pointer;width:34px;height:34px;border-radius:8px;font-size:15px;opacity:.65;flex:none}.pqdel:hover{opacity:1;background:rgba(163,38,26,.15)}
.block{position:relative}.block .bh{padding-right:34px}
.grip{position:absolute;display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:rgba(0,0,0,.2);color:inherit;font-size:16px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.grip:hover{background:rgba(255,255,255,.18)}
.task h3{margin-right:70px}

.task.fait{filter:grayscale(1);opacity:.6;border-style:dotted}.task.fait h3{text-decoration:line-through}.task.fait .done{opacity:1;background:#4a8a35;border-color:#9fd38a;color:#fff;filter:none}
.task.hold,.block.hold{transform:scale(.97);transition:transform .3s}
html.dragging,html.dragging body{overflow:hidden}
.block,.task{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#mvbar{position:fixed;z-index:1001;background:var(--gold1);border-radius:3px;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 0 10px var(--gold1);pointer-events:none}
